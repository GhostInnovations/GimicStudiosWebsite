<!DOCTYPE html>
<html>
    <head>
        <title>Development</title>
        <link rel="icon" type="image/x-icon" href="Bin assets/GIMMICK STUDIOS FAVICON 11.png">
        <link rel="stylesheet" href="CSS/Arcade.css">
    </head>

    <body>
            <img src="Bin assets/Arcade Background screen medium Joystick (Stationary).png" alt="Joystick" class="image" id="stationary-joystick">
            <img src="Bin assets/Arcade Background screen medium Joystick Animation Up.png" alt="Joystick" class="image-transition" id="move-up-joystick">
            <img src="Bin assets/Arcade Background screen medium Joystick Animation Down.png" alt="Joystick" class="image-transition" id="move-down-joystick">
            <img src="Bin assets/Arcade Background screen medium Joystick Animation Midway Down.png" alt="Joystick" class="image-transition" id="move-diagonally-down-joystick">

            <img src="Bin assets/Arcade Background screen medium Button (Stationary).png" alt="Button"  id="button-animation-stationary" class="image">
            <img src="Bin assets/Arcade Background screen medium Button (Pressed Down).png" alt="Button" id="button-animation-pressed-down" class="image-transition">

       <div class="container">
            <audio id="retro-blip" muted playsinline autoplay> 
            <source src="Audio/retro-blip.mp3" type="audio/mp3">
            <source src="Audio/retro-blip.ogg" type="audio/ogg">
          </audio>

          <audio id="retro-button" playsinline>
            <source src="Audio/retro-video-game-coin-pickup.mp3" type="audio/mp3">
            <source src="Audio/retro-video-game-coin-pickup.ogg" type="audio/ogg">
          </audio>

            <div class="screen">
                

                <a href="#"
                 onmouseover="Joystick_up()" onmouseout="Joystick_stationary()" onclick="Pressed_down_button_web_app_developement()">
                    <img src="Web and App Development Icon.png" alt="Web & App Development" class="web-and-development">
                    <video class="web-and-development-animation" muted playsinline loop autoplay>
                    <source src="Web & App Development Animation.webm" class="web-and-development-animation"></video>
                </a>
                    
                <a href="#" onmouseover="Joystick_down()" onmouseout="Joystick_stationary()" 
                onclick="Pressed_down_button_software_developement()">
                <img src="Software Development Icon.png" alt="Software Development" class="software-development">
                <video class="software-development-animation" muted playsinline loop autoplay>
                    <source  src="Software Development Icon Animation.webm"  class="software-development-animation"></video>
            </a>

                <a href="#" onmouseover="Joystick_diagonally_down()" onmouseout="Joystick_stationary()" onclick="Pressed_down_button_back()">
              <img src="Back Icon.png" alt="Back to" class="back-icon"></a>
            </div>


       </div>

       <script>
            const hover_sound = document.getElementById('retro-blip'); 

            function Joystick_down() {
                hover_sound.muted = false;
                hover_sound.play();
                joystick_down = document.getElementById('move-down-joystick').style.opacity = 1
                stationary_joystick = document.getElementById('stationary-joystick').style.opacity = 0}

            function Joystick_up() {
                hover_sound.muted = false;
                hover_sound.play();
                joystick_up = document.getElementById('move-up-joystick').style.opacity = 1
                stationary_joystick = document.getElementById('stationary-joystick').style.opacity = 0}
            
            function Joystick_stationary() {
                hover_sound.muted = false;
                hover_sound.play();
                joystick_down = document.getElementById('move-down-joystick').style.opacity = 0
                joystick_up = document.getElementById('move-up-joystick').style.opacity = 0
                joystick_down = document.getElementById('move-diagonally-down-joystick').style.opacity = 0
                stationary_joystick = document.getElementById('stationary-joystick').style.opacity = 1}

            function Stationary_button() {
                button_stationary = document.getElementById('stationary-button').style.opacity = 1
                button_pressed_down = document.getElementById('button-pressed-down').style.opacity = 0
            }

            function Joystick_diagonally_down() {
                hover_sound.muted = false;
                hover_sound.play();
                joystick_down = document.getElementById('move-diagonally-down-joystick').style.opacity = 1
                stationary_joystick = document.getElementById('stationary-joystick').style.opacity = 0}

            function Pressed_down_button_web_app_developement() {
                let button_sound = document.getElementById('retro-button');
                button_sound.play();

                setTimeout(() => {
                window.location.href = "Web & App Development.html";
                }, 500);

                button_stationary = document.getElementById('stationary-button').style.opacity = 0
                button_pressed_down = document.getElementById('button-pressed-down').style.opacity = 1
            }

            function Pressed_down_button_software_developement() {
                let button_sound = document.getElementById('retro-button');
                button_sound.play();

                setTimeout(() => {
                window.location.href = "Software Development page.html";
                }, 500);

                button_stationary = document.getElementById('stationary-button').style.opacity = 0
                button_pressed_down = document.getElementById('button-pressed-down').style.opacity = 1
            }

            function Pressed_down_button_back() {
                  let button_sound = document.getElementById('retro-button');
                  button_sound.play();

                  setTimeout(() => {
                    window.location.href = "Home page 2.html";
                  }, 500);

                  button_stationary = document.getElementById('stationary-button').style.opacity = 0
                  button_pressed_down = document.getElementById('button-pressed-down').style.opacity = 1
                }      



       </script>

    </body>
</html>
